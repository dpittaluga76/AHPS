[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ahps-compressor"
version = "2.6.0"
description = "Experimental lossless compression with reversible transforms and LZMA2"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "AHPS Compressor contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Topic :: System :: Archiving :: Compression",
]

[project.scripts]
ahps = "ahps:main"

[project.urls]
Repository = "https://github.com/dpittaluga76/ahps"

[tool.setuptools]
py-modules = ["ahps", "ahps_csv", "ahps_safetensors", "ahps_rans", "ahps_progress"]
